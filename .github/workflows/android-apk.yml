name: Android APK Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ standard ]
        include:
          - flavor: standard
            apkSuffix: ""
            cmakeArgs: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail

          # Do not use `yes | sdkmanager --licenses` without guarding the
          # producer. sdkmanager can exit after accepting all licenses, which
          # makes `yes` receive SIGPIPE and return exit code 1 (Broken pipe).
          # With pipefail enabled that incorrectly fails the entire CI job.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          set -o pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

          echo "=== Android toolchain ==="
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;36.0.0|ndk;29.0.14206865|cmake;3.22.1' || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

      - name: Verify project structure
        shell: bash
        run: |
          test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/AndroidManifest.xml
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/res/drawable/localimage_icon.png
          test -f app/src/main/cpp/npu/npu_backend.cpp
          test -f app/src/main/cpp/npu/qnn/qnn_context.cpp
          test -f app/src/main/cpp/npu/qnn/qnn_graph_executor.cpp
          test -f app/src/main/java/com/haobai/localimage/MainActivity.kt
          echo "✓ Project structure verified"

      - name: CMake configure preflight
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LocalImage-debug.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/LocalImage-release-unsigned.apk
          fi
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          echo "=== Build artifacts ==="
          ls -lh dist
          echo "=== SHA256 ==="
          cat dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalImage-APKs-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Publish/update continuous release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_BODY="### LocalImage Continuous Build
          Latest successful main-branch Android build.

          **Commit**: \`${GITHUB_SHA::7}\`
          **Date**: $(date -u +"%Y-%m-%d %H:%M UTC")

          #### Files
          - \`LocalImage-debug.apk\` — Debug build (installable directly)
          - \`LocalImage-release-unsigned.apk\` — Release build (needs signing)
          - \`SHA256SUMS.txt\` — Checksums

          #### NPU Support
          - Qualcomm QNN HTP backend code compiled in (stubbed without SDK)
          - Minimum target: Snapdragon 8 Gen3 (Hexagon DSP v75)
          - Enable with: \`-DLOCALIMAGE_QNN=ON -DQNN_SDK_ROOT=/path/to/sdk\`
          "

          if gh release view continuous >/dev/null 2>&1; then
            gh release upload continuous \
              dist/LocalImage-debug.apk \
              dist/LocalImage-release-unsigned.apk \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit continuous \
              --title "LocalImage Continuous Build" \
              --notes "$RELEASE_BODY" \
              --prerelease
          else
            gh release create continuous \
              dist/LocalImage-debug.apk \
              dist/LocalImage-release-unsigned.apk \
              dist/SHA256SUMS.txt \
              --title "LocalImage Continuous Build" \
              --notes "$RELEASE_BODY" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/LocalImage-debug.apk \
            dist/LocalImage-release-unsigned.apk \
            dist/SHA256SUMS.txt \
            --title "LocalImage ${GITHUB_REF_NAME}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
